services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wellis
      POSTGRES_PASSWORD: wellis
      POSTGRES_DB: wellis
    ports:
      # Non-default host port so a locally installed Postgres on 5432 does not shadow it.
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wellis -d wellis']
      interval: 2s
      timeout: 2s
      retries: 15
