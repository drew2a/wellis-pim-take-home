name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wellis
          POSTGRES_PASSWORD: wellis
          POSTGRES_DB: wellis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellis -d wellis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://wellis:wellis@localhost:5432/wellis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
