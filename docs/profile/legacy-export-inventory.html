<style>

      --accent: #4fd1c0; --accent-ink: #7fe3d6; --accent-soft: #163a36; --ws: #f0a04b; --ws-soft: #3b2a14;

  * { box-sizing: border-box; }

  a { color: var(--accent-ink); }
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule); padding: 20px 14px 40px; background: var(--surface); }
  nav h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.01em; }
  nav .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }

  nav a.col:hover { background: var(--band); }
  nav a.col .n { color: var(--muted); font-size: 11px; }
  nav a.col.hidden { display: none; }
  main { padding: 28px 40px 80px; max-width: 1100px; }
  header.top h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
  header.top p { max-width: 68ch; color: var(--muted); margin: 0 0 18px; }
  section.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 22px 20px; margin: 0 0 22px; scroll-margin-top: 16px; }
  section.panel.hidden { display: none; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-ink); font-weight: 600; }
  section.panel h2 { font-size: 18px; margin: 2px 0 10px; font-weight: 600; }
  section.panel h2 code { font-size: 17px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 0 14px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat { font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 15px; color: var(--ink); font-weight: 500; }
  .stat.warn b { color: var(--ws); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  .twrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); background: var(--band); padding: 5px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.raw, td.shape { white-space: pre; }
  .ws { color: var(--ws); background: var(--ws-soft); border-radius: 2px; }
  .empty { color: var(--muted); font-style: italic; font-family: "IBM Plex Sans", sans-serif; }
  .bar { display: inline-block; height: 9px; background: var(--bar); vertical-align: middle; margin-right: 6px; border-radius: 1px; min-width: 1px; }
  .barcell { white-space: nowrap; }
  .ex { color: var(--muted); }
  .more { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .more button { font: inherit; font-size: 12px; color: var(--accent-ink); background: none; border: 1px solid var(--rule); border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .more button:focus-visible { outline: 2px solid var(--accent); }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 3px 18px; margin: 0; font-size: 13px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }
  .verdict { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; color: #fff; }
  .v-confirmed { background: var(--ok); } .v-contradicted { background: var(--bad); } .v-partly { background: var(--partly); } .v-unverifiable { background: var(--na); }
  ul.findings { padding-left: 18px; margin: 0; } ul.findings li { margin: 0 0 6px; max-width: 80ch; }
  .note { font-size: 12px; color: var(--muted); max-width: 80ch; }

  @media print {
    @page { size: A4; margin: 12mm; }
    :root { --bg: #ffffff; --surface: #ffffff; --ink: #1a211e; --muted: #5f6d68; --rule: #d8dfdc; --band: #edf2f0; --accent: #0e7c72; --accent-ink: #0b5f58; --ws: #b4560a; --ws-soft: #fbead8; --bar: #9fd6cf; }
    .layout { display: block; }
    nav { display: none; }
    main { padding: 0; max-width: none; }
    section.panel { break-inside: auto; page-break-inside: auto; border: 0; border-top: 1px solid var(--rule); border-radius: 0; padding: 12px 0 8px; margin: 0 0 8px; }
    section.panel h2, h3 { break-after: avoid; }
    tr[hidden] { display: table-row !important; }
    tr { break-inside: avoid; }
    .more { display: none; }
    table { font-size: 11px; }

  }
</style>

claim":"patients.csv: `sex` is whatever the form or the ops person entered at the time","verdict":"confirmed","evidence":["P-5"],"evidenceKeys":["patients.csv.sex"],"note":"11 raw spellings, 7 after folding, Dutch and English mixed."},{"claim":"patients.csv: `bsn` is a Dutch citizen service number, never validated","verdict":"confirmed","evidence":["P-6"],"evidenceKeys":["patients.csv.bsn"],"note":"17 of 941 nine-digit values fail the elfproef."},{"claim":"patients.csv: `phone` format was never enforced","verdict":"confirmed","evidence":["P-7"],"evidenceKeys":["patients.csv.phone"],"note":"4 distinct shapes."},{"claim":"patients.csv: `city` is self-reported","verdict":"unverifiable","evidence":["P-8"],"evidenceKeys":["patients.csv.city"],"note":"Provenance is not in the export; 0 folded values have more than one raw spelling."},{"claim":"patients.csv: `weight` / `weight_unit` is weight at signup, with the unit column added late and backfilled \"where obvious\"","verdict":"partly","evidence":["P-9","P-10"],"evidenceKeys":["patients.csv.weight","patients.csv.weight_unit"],"note":"18 rows have no unit and 55 say lbs; 45 rows sit outside a 15..70 BMI window under the kilogram reading but inside it under the pound reading. When the backfill happened is not visible."},{"claim":"patients.csv: `height_cm` was always intended as centimetres","verdict":"partly","evidence":["P-11"],"evidenceKeys":["patients.csv.height_cm"],"note":"0 values below 3, 4 in 3..100, 0 in 100..140 and 1 at 220 or more."},{"claim":"patients.csv: `status` is roughly active / paused / churned / prospect, spelled many ways","verdict":"confirmed","evidence":["P-12"],"evidenceKeys":["patients.csv.status"],"note":"17 raw spellings, 11 after folding, including Dutch words and trailing whitespace."},{"claim":"patients.csv: `signup_date` is when the row was created","verdict":"partly","evidence":["P-13","P-35"],"evidenceKeys":["patients.csv.signup_date","cross.date-range"],"note":"3 rows are dated after the r   files.append($('h3', {}, 'Reference date'), $('p', { class: 'note' }, `${DATA.asOf}, given with --as-of; nothing is read from the clock or derived from the data. ${fmt(DATA.crossFile['cross.date-range'].totalRowsInIsolatedTails)} rows carry a date more than a year past everything else in their column (see Date ranges per column).`));
  main.append(files);

  const groups = {};
  for (const key of Object.keys(DATA.columns)) { const file = key.split('.').slice(0, 2).join('.'); (groups[file] ||= []).push(key); }
  nav.append($('h1', {}, 'Legacy Export Inventory'), $('p', { class: 'sub' }, `${Object.keys(DATA.columns).length} inventories, 3 files`));
  const search = $('input', { type: 'search', placeholder: 'Filter columns…', 'aria-label': 'Filter columns' });
  nav.append(search);
  nav.append($('a', { class: 'col', href: '#files' }, 'Files'));
  for (const [file, keys] of Object.entries(groups)) {
    nav.append($('div', { class: 'file' }, file));
    for (const key of keys) {
      const col = DATA.columns[key];
      const a = $('a', { class: 'col', href: '#c-' + key.replace(/[^a-z0-9]/gi, '-'), 'data-search': key.toLowerCase() }, $('span', {}, key.split('.').slice(2).join('.')), $('span', { class: 'n' }, col.distinct != null ? fmt(col.distinct) + ' distinct' : ''));
      nav.append(a);
      main.append(renderColumn(key, col));
    }
  }
  // cross-file
  nav.append($('div', { class: 'file' }, 'cross-file'));
  const cf = DATA.crossFile;
  const addCross = (id, title, ...nodes) => { const p = $('section', { class: 'panel', id, 'data-search': title.toLowerCase() }, $('div', { class: 'eyebrow' }, 'Cross-file'), $('h2', {}, title), ...nodes); main.append(p); nav.append($('a', { class: 'col', href: '#' + id, 'data-search': title.toLowerCase() }, $('span', {}, title))); };
  const dc = cf['cross.duplicate-candidates'];
  addCross('x-dup', 'Duplicate-patient candidates', $('h3', {}, 'Groupings'), objTable(dc.groupings), $('h3', {}, 'Overlap with the email grouping'), objTable(dc.overlapWithEmailGrouping));
  const dr = cf['cross.date-range'];
  addCross('x-dates', 'Date ranges per column', objTable(dr.perColumn.map((c) => ({ column: c.column, earliest: c.anyReading.earliest, latest: c.anyReading.latest, bulkLatest: c.isolatedTail ? c.isolatedTail.bulkLatest : '', isolatedTailRows: c.isolatedTail ? c.isolatedTail.rows : 0, isolatedTailDates: c.isolatedTail ? c.isolatedTail.dates.map((d) => d.date + ' x' + d.rows) : [] }))));
  const vr = cf['cross.variation'];
  const varNodes = [];
  for (const [dim, list] of Object.entries(vr)) {
    for (const entry of asList(list).items) {
      varNodes.push($('h3', {}, `${entry.column} (${entry.dimension}) by ${entry.groupedBy}`));
      varNodes.push(objTable(asList(entry.perGroup).items.map((g) => ({ group: g.group, distinct: g.distinct, topValues: asList(g.values).items.slice(0, 6).map((v) => `${v.value === '' ? '(empty)' : v.value} x${v.count}`) }))));
    }
  }
  addCross('x-var', 'Value sets that change with source or year', ...varNodes);

  // claims
  nav.append($('div', { class: 'file' }, 'export-notes'));
  const claimRows = DATA.exportNotesClaims.map((c) => $('tr', {}, $('td', { html: c.claim.replace(/`([^`]+)`/g, '<code>$1</code>') }), $('td', {}, $('span', { class: 'verdict v-' + c.verdict }, c.verdict)), $('td', { class: 'mono ex' }, c.evidence.join(', ')), $('td', {}, c.note)));
  const claims = $('section', { class: 'panel', id: 'claims', 'data-search': 'claims export-notes' }, $('div', { class: 'eyebrow' }, 'EXPORT-NOTES.md'), $('h2', {}, 'Claim by claim'), table(['claim', 'verdict', 'evidence', 'what the numbers say'], claimRows, { limit: 100 }));
  main.append(claims); nav.append($('a', { class: 'col', href: '#claims', 'data-search': 'claims' }, $('span', {}, 'Claims verified')));
  const nw = $('section', { class: 'panel', id: 'notwarned', 'data-search': 'not warned' }, $('div', { class: 'eyebrow' }, 'EXPORT-NOTES.md'), $('h2', {}, 'Not warned about'), $('ul', { class: 'findings' }, DATA.notWarnedAbout.map((f) => $('li', {}, f.finding, ' ', $('span', { class: 'mono ex' }, f.evidence.join(', '))))));
  main.append(nw); nav.append($('a', { class: 'col', href: '#notwarned', 'data-search': 'not warned' }, $('span', {}, 'Not warned about')));

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    for (const el of document.querySelectorAll('[data-search]')) el.classList.toggle('hidden', q !== '' && !el.dataset.search.includes(q));
  });
})();
